<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="design.css">
  <script src="rockpaperscissor.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="rps-container" aria-label="Choose Rock Paper or Scissors">
      <button class="rps-btn" data-choice="rock" aria-label="Rock">
        <span aria-hidden="true">✊</span>
        <span class="rps-label">Rock</span>
      </button>
      <button class="rps-btn" data-choice="paper" aria-label="Paper">
        <span aria-hidden="true">✋</span>
        <span class="rps-label">Paper</span>
      </button>
      <button class="rps-btn" data-choice="scissors" aria-label="Scissors">
        <span aria-hidden="true">✌️</span>
        <span class="rps-label">Scissors</span>
      </button>

      <div class="results"></div>

      <div class="score">
        Player: <span id="player-score">0</span> | 
        Computer: <span id="computer-score">0</span>
      </div>

      <button class="play-again">Play Again</button>
    </div>
  </div>
</body>
</html>
